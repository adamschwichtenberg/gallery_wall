<!doctype html><html><body style="background:#222;margin:0;color:#eee;font:12px sans-serif"><div id="out" style="display:flex;flex-wrap:wrap;gap:4px"></div><script type="module">
console.log("start");
import { loadPhoto, canvasToImg, imgToCanvas, visibleExtent } from '../src/lib/imaging';
import { detectWallMask, upsampleMask, repaint, maskPreview } from '../src/lib/recolor';
import { wallMaskOptions } from '../src/lib/paintwall';
console.log("imports ok");
const blob = await (await fetch('./samples/3.jpg')).blob();
const c = await loadPhoto(blob, 2400);
const src = canvasToImg(c); console.log("loaded", src.width);
const k = c.width / 1500;
const quad = [[90,560],[900,240],[900,1960],[105,1440]].map(([x,y])=>({x:x*k,y:y*k}));
const ext = visibleExtent(src.width, src.height, quad, 64, 96, 1);
const wall = { quad, refW: 64, refH: 96, bottomAboveFloor: 0, ...ext, sourceBlobId: 'x', surfaces: [] };
const out = document.getElementById('out');
window.results = {};
for (const t of [0.2, 0.4, 0.6, 0.8]) {
  const t0 = performance.now();
  const m = detectWallMask(src, wallMaskOptions(wall, [], { tolerance: t, hex: '', name: '', strength: 1 }, src.width, src.height));
  const ms = Math.round(performance.now() - t0);
  const full = upsampleMask(m, src.width, src.height);
  const p = repaint(src, full, '#9aa38f', 1);
  let cov = 0; for (const v of m.m) cov += v; 
  window.results[t] = { ms, coverage: +(cov / m.m.length).toFixed(3) };
  const box = document.createElement('div'); box.textContent = `t=${t} ${ms}ms`;
  const cv = imgToCanvas(p); cv.style.width = '280px'; cv.style.display='block'; box.append(cv); out.append(box);
}
window.done = true;
</script></body></html>
